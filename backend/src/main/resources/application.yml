spring:
  application:
    name: nexo-store-api
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:file:./data/nexostore;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
spring.jackson:
  default-property-inclusion: non_null
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${APP_JWT_SECRET:nexo-store-local-secret-at-least-32-characters}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:28800}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@nexo.pe}
    password: ${APP_ADMIN_PASSWORD:Admin123}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
